<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>sigx markdown — playground</title>
        <style>
            /* Playground chrome only — the markdown itself is styled by src/styles.css. */
            :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
            body { margin: 0; background: Canvas; color: CanvasText; }
            .app { display: flex; flex-direction: column; min-height: 100vh; }
            .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem 1.25rem; padding: 0.75rem 1rem; border-bottom: 1px solid color-mix(in srgb, CanvasText 15%, Canvas); position: sticky; top: 0; background: Canvas; z-index: 1; }
            .toolbar h1 { font-size: 1rem; margin: 0 1rem 0 0; }
            .toolbar label { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.9rem; cursor: pointer; }
            .toolbar input[type="number"] { width: 4.5rem; font: inherit; }
            .toolbar .status { font-size: 0.85rem; opacity: 0.75; font-family: ui-monospace, monospace; }
            .toolbar .last-link { font-size: 0.85rem; opacity: 0.75; font-family: ui-monospace, monospace; }
            button { font: inherit; padding: 0.35rem 0.75rem; border-radius: 0.4rem; border: 1px solid color-mix(in srgb, CanvasText 30%, Canvas); background: ButtonFace; color: ButtonText; cursor: pointer; }
            button:disabled { opacity: 0.5; cursor: default; }
            .panes { flex: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(22rem, 1fr)); gap: 1rem; padding: 1rem; box-sizing: border-box; }
            .pane { display: flex; flex-direction: column; min-width: 0; border: 1px solid color-mix(in srgb, CanvasText 15%, Canvas); border-radius: 0.5rem; overflow: hidden; }
            .pane > h2 { margin: 0; padding: 0.4rem 0.75rem; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.7; border-bottom: 1px solid color-mix(in srgb, CanvasText 15%, Canvas); }
            .pane > .body { flex: 1; overflow: auto; padding: 0.75rem 1rem; }
            .pane textarea { width: 100%; min-height: 32rem; height: 100%; box-sizing: border-box; resize: vertical; font: 0.85rem/1.5 ui-monospace, monospace; padding: 0.75rem; border: 0; background: Field; color: FieldText; }
            .pane pre.out { margin: 0; font: 0.8rem/1.45 ui-monospace, monospace; white-space: pre-wrap; word-break: break-word; }
            .pane-zero { grid-column: 1 / -1; height: 44rem; }
            .pane-zero > [data-scope="richtext-zero"][data-part="root"] { flex: 1; min-height: 0; border: 0; border-radius: 0; }
            .toolbar select { font: inherit; }
            .pane pre.out + h3, .pane h3 { margin: 1rem 0 0.4rem; font-size: 0.8rem; opacity: 0.7; }
        </style>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
