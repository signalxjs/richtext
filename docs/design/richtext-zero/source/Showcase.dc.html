<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zero editor showcase</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
.sc-btn{cursor:pointer}
.sc-btn:focus-visible,.sc-link:focus-visible{outline:2px solid #2f5bd3;outline-offset:2px}
</style>
</helmet>
<div style="width: 1440px; height: 1064px; display: flex; flex-direction: column; overflow: hidden; background: #17171a; font-family: 'Geist', system-ui, sans-serif">
<div style="height: 64px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; gap: 24px; padding: 0 20px; color: #f4f4f1">
<div style="display: flex; align-items: center; gap: 10px">
<span style="font-family: 'Geist Mono', monospace; font-size: 15px; font-weight: 600">@sigx/richtext-zero</span>
<span style="padding: 2px 8px; border-radius: 999px; border: 1px solid #3a3a42; color: #c9c9cf; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase">Showcase</span>
</div>
<span style="flex-grow: 1"></span>
<span id="skin-label" style="font-size: 13px; color: #a3a3ab">Design system</span>
<div role="radiogroup" aria-labelledby="skin-label" style="display: flex; gap: 6px">
<sc-for list="{{skins}}" as="s" hint-placeholder-count="2">
<button type="button" role="radio" class="sc-btn" aria-checked="{{s.checked}}" onClick="{{s.pick}}" style="height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 14px 0 10px; border: 1px solid {{s.border}}; border-radius: 999px; background: {{s.bg}}; color: {{s.fg}}; font-family: inherit; font-size: 13px; font-weight: 500">
<span aria-hidden="true" style="display: flex"><span style="width: 14px; height: 14px; border-radius: 99px; background: {{s.c1}}; box-shadow: 0 0 0 2px {{s.ring}}"></span><span style="width: 14px; height: 14px; margin-left: -4px; border-radius: 99px; background: {{s.c2}}; box-shadow: 0 0 0 2px {{s.ring}}"></span></span>
{{s.label}}
<code style="font-family: 'Geist Mono', monospace; font-size: 11px; color: {{s.pkgFg}}">{{s.pkg}}</code>
</button>
</sc-for>
</div>
<span style="width: 1px; height: 24px; background: #3a3a42"></span>
<a href="Lab.dc.html" class="sc-link" style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 8px; color: #f4f4f1; font-size: 13px; font-weight: 500; text-decoration: none"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6 M10 3v6.5L4.5 19a1.5 1.5 0 0 0 1.3 2h12.4a1.5 1.5 0 0 0 1.3-2L14 9.5V3 M7 15h10"></path></svg>Open the Lab</a>
</div>
<div style="flex-grow: 1; min-height: 0; overflow: hidden; border-radius: 12px 12px 0 0">
<dc-import name="Main" skin="{{skin}}" overlay="bubble" hint-size="1440px,1000px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1064}}'>
var SKINS = [
  { id: 'basic', label: 'Basic', pkg: 'zero-basic', c1: '#1d4ed8', c2: '#f5f5f4' },
  { id: 'daisyui', label: 'daisyUI', pkg: 'zero-daisyui', c1: '#605dff', c2: '#ebeaff' }
];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { skin: 'basic' };
  }
  renderVals() {
    var self = this;
    return {
      skin: this.state.skin,
      skins: SKINS.map(function (s) {
        var on = s.id === self.state.skin;
        return Object.assign({}, s, {
          checked: String(on),
          bg: on ? '#f4f4f1' : 'transparent',
          fg: on ? '#17171a' : '#e4e4e8',
          border: on ? '#f4f4f1' : '#3a3a42',
          ring: on ? '#f4f4f1' : '#17171a',
          pkgFg: on ? '#55555c' : '#a3a3ab',
          pick: function () { self.setState({ skin: s.id }); }
        });
      })
    };
  }
}
</script>
</body>
</html>
